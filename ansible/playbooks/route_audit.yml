---
# ✅ COMPLETE EXAMPLE — Use this as your reference for writing other playbooks
#
# This playbook collects routing state from all lab routers and saves to JSON.
# Study how it works, then use the same patterns in bgp_config.yml and emergency_shutdown.yml.

- name: Collect routing state from all devices
  hosts: all
  gather_facts: false

  tasks:
    - name: Get BGP summary
      cisco.ios.ios_command:
        commands:
          - show ip bgp summary
      register: bgp_summary
      when: bgp_role != 'none'

    - name: Get OSPF neighbors
      cisco.ios.ios_command:
        commands:
          - show ip ospf neighbor
      register: ospf_neighbors

    - name: Get full routing table
      cisco.ios.ios_command:
        commands:
          - show ip route
      register: ip_routes

    - name: Save output to local JSON
      delegate_to: localhost
      copy:
        content: |
          {
            "hostname": "{{ inventory_hostname }}",
            "bgp_summary": {{ bgp_summary.stdout | default(['N/A']) | to_json }},
            "ospf_neighbors": {{ ospf_neighbors.stdout | to_json }},
            "routing_table": {{ ip_routes.stdout | to_json }}
          }
        dest: "../outputs/device_state_{{ inventory_hostname }}.json"
