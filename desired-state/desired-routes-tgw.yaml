# Desired TGW Route Table State
# This file defines what routes SHOULD exist in each TGW route table.
# The validator compares live state against this and reports drift.

tgw_id: tgw-0cb2f8b72ce3f2dae
region: eu-west-1

route_tables:
  fullmesh:
    description: "Full mesh — all spokes can reach each other"
    expected_routes:
      - destination: "10.4.0.0/22"   # spoke-dev1-vpc
        type: propagated
        attachment_name: spoke-dev1
      - destination: "10.12.0.0/22"  # spoke-dev2-vpc
        type: propagated
        attachment_name: spoke-dev2

  firewall:
    description: "Firewall inspection — routes propagated from spokes for inspection"
    expected_routes:
      - destination: "10.4.0.0/22"
        type: propagated
        attachment_name: spoke-dev1
      - destination: "10.12.0.0/22"
        type: propagated
        attachment_name: spoke-dev2
      - destination: "0.0.0.0/0"
        type: static
        attachment_name: firewall-vpc

  spoke:
    description: "Spoke route table — default route to firewall"
    expected_routes:
      - destination: "0.0.0.0/0"
        type: static
        attachment_name: firewall-vpc

  shared:
    description: "Shared services — accessible from all spokes"
    expected_routes: []

# Validation rules
rules:
  - name: "No blackholes"
    check: no_blackhole_routes
  - name: "No route leaks between fullmesh and spoke"
    check: no_cross_domain_routes
    domains: [fullmesh, spoke]
