name: Deploy Router Configs

on:
  push:
    paths:
      - 'python/netops/configurator/**'
    branches:
      - main

jobs:
  validate:
    name: Validate Templates
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Dry Run - Validate all templates render correctly
        working-directory: python
        run: |
          source .venv/bin/activate
          python -m netops.configurator.push_config --all --template mpls_base.j2 --dry-run

  deploy:
    name: Deploy to Routers
    runs-on: self-hosted
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Push config to all routers
        working-directory: python
        run: |
          source .venv/bin/activate
          python -m netops.configurator.push_config --all --template mpls_base.j2
