[project]
name = "netops"
version = "0.1.0"
description = "Hybrid Network Operations Platform — validators, collectors, and automation for cloud + on-prem networks"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "netmiko>=4.3",
    "napalm>=5.0",
    "pytest>=8.0",
]

[project.scripts]
netops = "netops.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
